name: E2E (Playwright)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install

      - name: Setup Supabase
        uses: supabase/setup-cli@v1

      - name: Start Supabase
        run: supabase start

      - name: Build project
        run: |
          export VITE_SUPABASE_URL="http://127.0.0.1:54321"
          export VITE_SUPABASE_ANON_KEY=$(supabase status -o json | jq -r .ANON_KEY)
          pnpm run build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Debug – listar árbol de tests y config
        run: |
          pwd
          node -v
          ls -la
          echo "----- tests tree -----"
          ls -R tests || true
          echo "----- playwright.config.ts -----"
          sed -n '1,200p' playwright.config.ts || true

      - name: Lista de tests detectados
        run: pnpm exec playwright test --list
        env:
          CI: true

      - name: Run E2E
        run: |
          export VITE_SUPABASE_URL="http://127.0.0.1:54321"
          export VITE_SUPABASE_ANON_KEY=$(supabase status -o json | jq -r .ANON_KEY)
          pnpm exec playwright test --reporter=line
        env:
          CI: true

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
